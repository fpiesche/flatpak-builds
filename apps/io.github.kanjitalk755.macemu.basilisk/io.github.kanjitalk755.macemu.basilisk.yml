app-id: io.github.kanjitalk755.macemu.basilisk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: BasiliskII

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --allow=bluetooth

build-options:
  strip: true
  no-debuginfo: true

modules:
  - name: basilisk
    buildsystem: autotools
    subdir: BasiliskII/src/Unix
    no-parallel-make: true
    sources:
      - type: git
        url: https://github.com/kanjitalk755/macemu.git
        commit: d82757beb911efb8108d230de978026ef1046cc7
        x-checker-data:
          type: json
          url: https://api.github.com/repos/kanjitalk755/macemu/branches/master
          commit-query: .commit.sha
