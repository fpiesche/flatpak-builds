app-id: io.github.dsda_org.dsda-doom
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: io.github.dsda_org.dsda-doom.sh

rename-icon: dsda-doom
rename-desktop-file: dsda-doom.desktop

finish-args:
  # gamepad support
  - --device=all
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Audio
  - --socket=pulseaudio

cleanup:
  - /include
  - '*.a'
  - '*.la'
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man

build-options:
  strip: true
  no-debuginfo: true

modules:
  - ../shared-modules/glu/glu-9.json
  - ../shared-modules/SDL2/SDL2_image.json
  - ../shared-modules/libmad/libmad.json
  - ../shared-modules/linux-audio/fluidsynth2.json

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DCMAKE_INSTALL_INCLUDEDIR=/app/include
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.12.tar.xz
        sha256: 376908d0f0fda13180a19fdc4f7062a1abfb59e09ca07a392d361253b8e60c2b
        x-checker-data:
          type: anitya
          project-id: 10649
          url-template: https://libzip.org/download/libzip-$version.tar.xz

  - name: libdumb
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_ALLEGRO4=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://api.github.com/repos/kode54/dumb/tarball/396caa4d31859045ccb5ef943fd430ca4026cce8
        sha256: 57738c93e42a76d94b76502464962e521eb74b669e8ac56eb23349dd4ab078c5
        dest-filename: dumb.tar.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/kode54/dumb/branches/master
          version-query: .commit.sha
          url-query: ("https://api.github.com/repos/kode54/dumb/tarball/" + .commit.sha)
  - name: portmidi
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://api.github.com/repos/PortMidi/portmidi/tarball/v2.0.7
        dest-filename: portmidi.tar.gz
        sha256: e4851b707685e2c318646e97621014918a93daab43d483d344e6e460231da5e0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/portmidi/portmidi/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .tarball_url
  - name: libxmp
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/libxmp/libxmp/
        tag: libxmp-4.7.4
        commit: 5d4f6aa2c7dcdf8e9cd8129fe579d45b36a302da
        x-checker-data:
          type: git
          tag-pattern: ^libxmp-(.*)$

  - name: dsda-doom
    buildsystem: cmake-ninja
    subdir: prboom2
    builddir: true
    sources:
      - type: archive
        url: https://api.github.com/repos/dsda-org/dsda-doom/tarball/v0.30.1
        dest-filename: dsda-doom.tar.gz
        sha256: f82f993d9d1fc1d62ffd318ebd5f333b067150c8f7114009cc78c4f46524295f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/dsda-org/dsda-doom/releases
          version-query: .[0].tag_name | sub("^v"; "")
          url-query: .[0].tarball_url
      - type: file
        path: io.github.dsda_org.dsda-doom.metainfo.xml
    post-install:
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
  - name: dsda-launcher
    buildsystem: simple
    build-options:
      env:
        - QT_INSTALL_PREFIX=/app
    subdir: src
    sources:
      - type: archive
        url: https://api.github.com/repos/dsda-org/dsda-launcher/tarball/v1.5.2
        dest-filename: dsda-doom-launcher.tar.gz
        sha256: 95cf743c3a0f5eaefe13403d5f0699fd3e004f0bd70e60cd4a3669a352dac87e
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Pedro-Beirao/dsda-launcher/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .tarball_url
      - type: patch
        paths:
          - dsda-launcher-disable-updates.patch
      - type: file
        url: https://raw.githubusercontent.com/Pedro-Beirao/dsda-launcher/refs/heads/master/dist/icons/eu.pedro_beirao.dsda-launcher.svg
        sha256: 592a9c413a4809dcbad14bd1ac03f6abb3f8806264c2b52919ee5149b73db68d
      - type: script
        dest-filename: io.github.dsda_org.dsda-doom.sh
        commands:
          - if [[ ! -d "$XDG_DATA_HOME/dsda-doom" ]]; then mkdir -p "$XDG_DATA_HOME/dsda-doom";
            fi
          - dsda-launcher $@
    build-commands:
      - mkdir build && cd build && qmake ..
      - cd build && make
      - install -Dm755 build/dsda-launcher -t /app/bin
      - install -Dm755 ${FLATPAK_BUILDER_BUILDDIR}/${FLATPAK_ID}.sh -t /app/bin
      - desktop-file-edit --set-icon=${FLATPAK_ID}.launcher ${FLATPAK_BUILDER_BUILDDIR}/dist/linux/eu.pedro_beirao.dsda-launcher.desktop
      - desktop-file-edit --set-key=Comment --set-value="Graphical launcher for DSDA
        Doom" ${FLATPAK_BUILDER_BUILDDIR}/dist/linux/eu.pedro_beirao.dsda-launcher.desktop
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/dist/linux/eu.pedro_beirao.dsda-launcher.desktop
        /app/share/applications/${FLATPAK_ID}.launcher.desktop
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/eu.pedro_beirao.dsda-launcher.svg
        /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.launcher.svg
